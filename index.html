<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MindShelf v1.0.0</title>
  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #111;
}

.app {
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #111;
  color: white;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sidebar button {
  padding: 10px;
  border: none;
  cursor: pointer;
  background: #222;
  color: white;
  border-radius: 6px;
}

.sidebar button:hover {
  background: #333;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.view {
  display: none;
}

.view.active {
  display: block;
}

/* CARDS */
.cards {
  display: flex;
  gap: 10px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  flex: 1;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* INPUT */
.input-area {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}

input, textarea {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

/* CHAT ITEM */
.chat {
  background: white;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
}

.chat small {
  color: gray;
}

/* DARK MODE */
.dark {
  background: #121212;
  color: white;
}

.dark .card,
.dark .chat {
  background: #1e1e1e;
}

.dark input,
.dark textarea {
  background: #222;
  color: white;
}
  </style>
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>🧠 MindShelf</h2>

      <button onclick="setView('dashboard')">Dashboard</button>
      <button onclick="setView('chats')">Chats</button>
      <button onclick="setView('favorites')">Favorites</button>
      <button onclick="setView('analysis')">Behavior</button>

      <hr/>

      <button onclick="toggleTheme()">🌗 Theme</button>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- DASHBOARD -->
      <section id="dashboard" class="view active">
        <h1>Dashboard</h1>

        <div class="cards">
          <div class="card">
            <h3>Total Chats</h3>
            <p id="totalChats">0</p>
          </div>

          <div class="card">
            <h3>Pinned</h3>
            <p id="totalPinned">0</p>
          </div>

          <div class="card">
            <h3>Categories</h3>
            <p id="totalCategories">0</p>
          </div>
        </div>
      </section>

      <!-- CHATS -->
      <section id="chats" class="view">
        <h1>Chats</h1>

        <div class="input-area">
          <input id="chatTitle" placeholder="Chat title"/>
          <input id="chatTag" placeholder="Tag (AI, Career, etc)"/>
          <textarea id="chatContent" placeholder="Write your chat or insight..."></textarea>

          <button onclick="addChat()">Add Chat</button>
        </div>

        <input id="search" placeholder="Search chats..." oninput="renderChats()"/>

        <div id="chatList"></div>
      </section>

      <!-- FAVORITES -->
      <section id="favorites" class="view">
        <h1>Favorites</h1>
        <div id="favoriteList"></div>
      </section>

      <!-- ANALYSIS -->
      <section id="analysis" class="view">
  <h1>🧠 Behavior Analysis</h1>

  <div class="cards">

    <div class="card">
      <h3>Top Interest</h3>
      <p id="topInterest">No data</p>
    </div>

    <div class="card">
      <h3>Main Goal</h3>
      <p id="mainGoal">No data</p>
    </div>

    <div class="card">
      <h3>Consistency</h3>
      <p id="consistency">No data</p>
    </div>

  </div>

  <div class="card" style="margin-top:20px;">
    <h3>Insights</h3>
    <div id="analysisBox"></div>
  </div>
      </section>

    </main>
  </div>

  <script>

let chats =
  JSON.parse(localStorage.getItem("mindshelf_chats")) || [];

/* VIEW SWITCH */
function setView(viewId) {
  document
    .querySelectorAll(".view")
    .forEach(v => v.classList.remove("active"));

  document
    .getElementById(viewId)
    .classList.add("active");

  updateDashboard();
  renderChats();
  analyzeBehavior();
}

/* ADD CHAT */
function addChat() {
  const title =
    document.getElementById("chatTitle").value;

  const tag =
    document.getElementById("chatTag").value;

  const content =
    document.getElementById("chatContent").value;

  if (!title || !content) return;

  const chat = {
    id: Date.now(),
    title,
    tag,
    content,
    favorite: false,
    date: new Date().toLocaleDateString()
  };

  chats.push(chat);

  save();
  renderChats();
  updateDashboard();
  analyzeBehavior();

  document.getElementById("chatTitle").value = "";
  document.getElementById("chatTag").value = "";
  document.getElementById("chatContent").value = "";
}

/* SAVE */
function save() {
  localStorage.setItem(
    "mindshelf_chats",
    JSON.stringify(chats)
  );
}

/* RENDER CHATS */
function renderChats() {
  const list =
    document.getElementById("chatList");

  const search =
    document.getElementById("search")
      ?.value || "";

  list.innerHTML = "";

  chats
    .filter(c =>
      c.title
        .toLowerCase()
        .includes(search.toLowerCase()) ||

      c.tag
        .toLowerCase()
        .includes(search.toLowerCase())
    )
    .forEach(chat => {
      const div =
        document.createElement("div");

      div.className = "chat";

      div.innerHTML = `
        <h3>${chat.title}</h3>

        <small>
          #${chat.tag}
          • ${chat.date}
        </small>

        <p>${chat.content}</p>

        <button onclick="toggleFav(${chat.id})">
          ${
            chat.favorite
              ? "★ Remove Fav"
              : "☆ Favorite"
          }
        </button>

        <button onclick="deleteChat(${chat.id})">
          Delete
        </button>
      `;

      list.appendChild(div);
    });

  renderFavorites();
}

/* FAVORITES */
function toggleFav(id) {
  chats = chats.map(c =>
    c.id === id
      ? { ...c, favorite: !c.favorite }
      : c
  );

  save();
  renderChats();
}

/* DELETE */
function deleteChat(id) {
  chats =
    chats.filter(c => c.id !== id);

  save();
  renderChats();
  updateDashboard();
  analyzeBehavior();
}

/* FAVORITE VIEW */
function renderFavorites() {
  const fav =
    document.getElementById(
      "favoriteList"
    );

  fav.innerHTML = "";

  chats
    .filter(c => c.favorite)
    .forEach(chat => {
      const div =
        document.createElement("div");

      div.className = "chat";

      div.innerHTML = `
        <h3>${chat.title}</h3>
        <p>${chat.content}</p>
      `;

      fav.appendChild(div);
    });
}

/* DASHBOARD */
function updateDashboard() {
  document.getElementById(
    "totalChats"
  ).innerText = chats.length;

  document.getElementById(
    "totalPinned"
  ).innerText =
    chats.filter(c => c.favorite).length;

  const tags =
    new Set(chats.map(c => c.tag));

  document.getElementById(
    "totalCategories"
  ).innerText =
    tags.size;
}

/* THEME */
function toggleTheme() {
  document.body
    .classList
    .toggle("dark");
}

/* ==========================
   BEHAVIOR ANALYSIS ENGINE
========================== */

function analyzeBehavior() {

  const analysisBox =
    document.getElementById(
      "analysisBox"
    );

  if (chats.length === 0) {
    analysisBox.innerHTML =
      "No behavior data yet.";

    return;
  }

  /* TOP INTEREST */
  const tagCount = {};

  chats.forEach(chat => {
    const tag =
      chat.tag.toLowerCase();

    if (tag) {
      tagCount[tag] =
        (tagCount[tag] || 0) + 1;
    }
  });

  const topInterest =
    Object.keys(tagCount)
      .sort(
        (a, b) =>
          tagCount[b] -
          tagCount[a]
      )[0] || "Unknown";

  /* GOAL DETECTION */
  const goalWords = [
    "learn",
    "become",
    "improve",
    "master",
    "practice",
    "build"
  ];

  const goals = [];

  chats.forEach(chat => {

    const text =
      (
        chat.title +
        " " +
        chat.content
      ).toLowerCase();

    goalWords.forEach(word => {
      if (text.includes(word)) {
        goals.push(word);
      }
    });
  });

  const mainGoal =
    goals.length > 0
      ? goals[0]
      : "No clear goal";

  /* CONSISTENCY */
  let consistency =
    "Low";

  if (chats.length >= 5)
    consistency = "Medium";

  if (chats.length >= 10)
    consistency = "High";

  /* INSIGHTS */
  let insights = [];

  insights.push(
    `Your strongest interest is "${topInterest}".`
  );

  insights.push(
    `Your main learning pattern appears to be "${mainGoal}".`
  );

  if (
    chats.length > 10
  ) {
    insights.push(
      "You are consistently storing ideas and learning materials."
    );
  }

  if (
    Object.keys(tagCount)
      .length > 5
  ) {
    insights.push(
      "You explore many topics. Consider focusing on fewer priorities."
    );
  }

  /* UPDATE UI */
  document.getElementById(
    "topInterest"
  ).innerText =
    topInterest;

  document.getElementById(
    "mainGoal"
  ).innerText =
    mainGoal;

  document.getElementById(
    "consistency"
  ).innerText =
    consistency;

  analysisBox.innerHTML =
    insights
      .map(
        i => `<p>• ${i}</p>`
      )
      .join("");
}

/* INIT */
renderChats();
updateDashboard();
analyzeBehavior();

  </script>
</body>
</html>
